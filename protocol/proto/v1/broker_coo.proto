syntax = "proto3";
package crabmq.protocol.v1;

import "common.proto";

// Broker COO 心跳请求
message BrokerCooHeartbeatRequest {
    uint32 broker_id = 1;
    string broker_addr = 2;
    string version = 3;
    // 该 broker 网络速率
    uint32 netrate = 4;
    // 该 broker 的 cpu 占用率
    uint32 cpurate = 5;
    // 该 broker 的内存占用率
    uint32 memrate = 6;
    // 该 broker 的磁盘占用率
    uint32 diskrate = 7;
    // 该 broker 的订阅连接数
    uint32 sub_count = 8;
    // 该 broker 的发布连接数
    uint32 pub_count = 9;
    // 该 broker 的时间戳
    uint64 timestamp = 10;
}

// Broker COO 心跳响应
message BrokerCooHeartbeatResponse {
    uint32 code = 1; // u16 -> uint32
    string message = 2;
    Topics topics = 3;
}
