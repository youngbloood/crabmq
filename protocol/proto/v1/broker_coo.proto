syntax = "proto3";
package crabmq.protocol.v1;

import "common.proto";

// Broker COO 心跳请求
message BrokerCooHeartbeatRequest {
    // COO 认证 token（第一次时需要）
    optional string token = 1;
    // broker ID
    uint32 broker_id = 2;
    // broker metadata
    map<string,string> metadata = 3;
    // broker version
    string version = 4;
    // sequence number
    uint64 seq = 5;
    // 该 broker 网络速率
    uint32 netrate = 6;
    // 该 broker 的 cpu 占用率
    uint32 cpurate = 7;
    // 该 broker 的内存占用率
    uint32 memrate = 8;
    // 该 broker 的磁盘占用率
    uint32 diskrate = 9;
    // 该 broker 的订阅连接数
    uint32 sub_count = 10;
    // 该 broker 的发布连接数
    uint32 pub_count = 11;
    // 该 broker 的时间戳
    uint64 timestamp = 12;
}

// Broker COO 心跳响应
message BrokerCooHeartbeatResponse {
    // 响应码
    uint64 code = 1;
    // 响应消息
    string message = 2;

    // 响应 seq + 1
    uint64 seq = 3;
    // term
    uint64 term = 4;
    // 心跳额外携带的信息
    optional RaftNodes raft_nodes = 5;
    optional Topics topics = 6;
    optional ConsumerGroups consumer_groups = 7; 
}